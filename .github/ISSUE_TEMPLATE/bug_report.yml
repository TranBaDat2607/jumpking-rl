name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the full traceback if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it?
      placeholder: |
        import gymnasium as gym
        env = gym.make("jumpking.envs:JumpKing-v0")
        ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `jumpking info`, plus your OS and Python version.
    validations:
      required: true
