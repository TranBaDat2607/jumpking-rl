[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jumpking-rl"
version = "0.3.0"
description = "A tick-exact Jump King simulator (base game, New Babe+, Ghost of the Babe and all 48 achievements) with Gymnasium environments for reinforcement learning"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Tran Ba Dat"}]
requires-python = ">=3.10"
keywords = ["reinforcement-learning", "gymnasium", "jump-king", "hard-exploration", "platformer", "numba"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy>=1.22",
    "numba>=0.57",
    "gymnasium>=1.0",
    "pillow>=9",
    "dnfile>=0.14",
]

[project.optional-dependencies]
play = ["pygame>=2.1"]
train = ["torch>=2.0", "stable-baselines3>=2.2"]
dev = ["pytest>=7", "pygame>=2.1", "dnfile>=0.14"]

[project.urls]
Homepage = "https://github.com/TranBaDat2607/jumpking-rl"
Documentation = "https://github.com/TranBaDat2607/jumpking-rl/blob/main/docs/RL_GUIDE.md"
Issues = "https://github.com/TranBaDat2607/jumpking-rl/issues"
Changelog = "https://github.com/TranBaDat2607/jumpking-rl/blob/main/CHANGELOG.md"

[project.scripts]
jumpking = "jumpking.cli:main"

[tool.setuptools.packages.find]
include = ["jumpking*"]

[tool.setuptools.package-data]
jumpking = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
